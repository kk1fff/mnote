services:
  mnote:
    build: .
    init: true
    ports:
      - "3000:3000"
    environment:
      MNOTE_PUBLIC_URL: http://localhost:3000
    volumes:
      - mnote-data:/data

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    init: true
    working_dir: /workspace
    volumes:
      - .:/workspace
    shm_size: 1gb

volumes:
  mnote-data:
